name: Infinite Restream
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'  # كل 5 ساعات احتياطي

permissions:
  contents: write
  actions: write

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Start Live Stream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x restream.sh
          # تشغيل البث في الخلفية
          ./restream.sh &
          
          # انتظر 3 ثوانٍ للتأكد من بدء البث
          sleep 3
          
          # تحديث المقاطع بشكل سريع كل 30 ثانية
          while true; do
            sleep 30
            git config --global user.name "StreamBot"
            git config --global user.email "bot@github.com"
            git add hls/
            git commit -m "Live segment update $(date +%s)" || true
            git push origin main || true
          done
