name: Infinite Restream
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  actions: write

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Start Stream with Auto-Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x restream.sh
          # تشغيل البث في الخلفية مع تسجيل الخرج
          ./restream.sh > stream.log 2>&1 &
          
          # رفع الملفات كل 30 ثانية لمدة 5.5 ساعات
          for i in {1..660}; do
            sleep 30
            # إظهار تقدم البث (مهم ليبقى الـ Action نشطاً)
            echo "[$(date)] Uploading HLS files - iteration $i"
            
            git config --global user.name "StreamBot"
            git config --global user.email "bot@github.com"
            git add hls/
            # فقط يرفع إذا كان هناك تغييرات
            if ! git diff --cached --quiet; then
              git commit -m "Auto-update HLS segments - $i"
              git push origin main
              echo "[$(date)] HLS files uploaded successfully"
            else
              echo "[$(date)] No changes to upload"
            fi
            
            # إظهار آخر 5 أسطر من الـ log للتأكد أن البث يعمل
            if [ -f stream.log ]; then
              echo "--- Last 5 lines of stream.log ---"
              tail -5 stream.log
            fi
          done
          
          # إعادة تشغيل الـ workflow نفسه قبل النهاية بـ 10 دقائق
          echo "Restarting workflow..."
          gh workflow run "Infinite Restream"
