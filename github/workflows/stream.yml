name: Live Stream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

permissions:
  contents: write

jobs:
  stream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Stream
        run: |
          chmod +x restream.sh
          ./restream.sh

      - name: Upload HLS
        run: |
          git config user.name "StreamBot"
          git config user.email "bot@github.com"
          git add hls/ --force
          git commit -m "update" || echo "no changes"
          git push origin main
